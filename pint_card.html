<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <style>
    :root {
      --TRANSPARENT-JET: rgb(37, 38, 38);
      --GENTLE-GREEN: rgb(82, 173, 82);
      --BRIGHT: rgb(255, 255, 255);
      --GRY: rgba(45, 46, 46, 0.686);
      --TRANSPARENT-GRY: rgba(30, 31, 31, 0.871);
    }
    body {
      background-color: var(--TRANSPARENT-JET);
    }
    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      position: relative;
      justify-content: center;
      
    }
    .profile-card {
      position: relative;
      background-color: var(--GRY);
      color: var(--BRIGHT);
      border-radius: 25px;
      padding: 5px;
      text-align: center;
      width: 14rem;
      max-width: 14rem;
      height: 23rem;
      max-height: 23rem;
      font-size: 0.9rem;
      overflow: hidden;
    }
    .profile-card-expand {
      position: relative;
      background-color: var(--GRY);
      color: var(--BRIGHT);
      border-radius: 25px;
      padding: 5px;
      text-align: center;
      width: 14rem;
      max-width: 14rem;
      height: 23rem;
      max-height: 23rem;
      overflow: hidden;
    }
    .profile-card img {
      width: 13.5rem;

      height: 13rem;
      object-fit: cover;
      border-radius: 25px;
      margin-bottom: 15px;
      justify-self: center;
    }
    .profile-card .bi-patch-check-fill {
        color: var(--GENTLE-GREEN);
    }
    .profile-card-expand img {
      width: 13.5rem;

      height: 22.5rem;
      object-fit: cover;
      border-radius: 25px;
      justify-self: center;
    }
    .profile-card h5 {
      margin-bottom: 5px;
    }
    .profile-card-expand h5 {
      margin-bottom: 5px;
    }
    .stats {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 1px 0;
    }
    .stats span {
        align-content: center;
    }
    .stats button {
        align-self: center;
        background-color: var(--TRANSPARENT-GRY);
    }
    .btn-follow {
      background-color: #f5f2f2;
      color: #f5f2f2;
      border-radius: 20px;
      padding: 5px 15px;
      font-size: 0.9rem;
    }
    .description-overlay .btn-follow{
      height: 2rem;
      white-space: nowrap;
    }
    .description-overlay .stats{
      align-content: center;
      height: 2rem;
      white-space: nowrap;
      margin-bottom: 8px;
    }
    .description-overlay {
      position: absolute;
      bottom: 0px;
      left: 0;
      width: 100%;
      background: #282b2b54;
      padding: 10px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body class="d-flex justify-content-center align-items-center vh-100">

    <div class="cards">
        <!-- Profile Card -->
        <div class="profile-card">
            <img src="/MartinDev/static/img/pac.jpg" data-target="cardImg" alt="Sophie Bennett">
            <h5>Tupac Shakur <i class="bi bi-patch-check-fill"></i></h5>
            
            <p>Rap Genius, the greatest rapper of all the time, he is a legend.</p>
            <div class="stats">
                <span><i class="bi bi-chat"></i> 31K</span>
                <span><i class="bi bi-people"></i> 48B</span>
                <button class="btn btn-follow" id="btn-follow">Follow +</button>
            </div>
        </div>
        
        <div class="profile-card-expand">
            <img src="/MartinDev/static/img/pac.jpg" data-target="cardImg" alt="Sophie Bennett">
            
            <!-- Hidden description that slides up -->
            <div class="description-overlay" >
                <h5>Tupac Shakur <i class="bi bi-patch-check-fill"></i> </h5>
                <p>Rap Genius, the greatest rapper of all the time, he is a legend.</p>
                <div class="stats">
                    <span><i class="bi bi-chat"></i> 31K</span>
                    <span><i class="bi bi-people"></i> 48B</span>
                    <button class="btn btn-follow" id="expand-btn-follow">Follow +</button>
                </div>
            </div>
        </div>
    </div>


  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const btnFollow = document.getElementById('btn-follow');
    const expandBtnFollow = document.getElementById('expand-btn-follow');
    btnFollow.addEventListener('click', () => {
      btnFollow.textContent = 
        btnFollow.textContent.trim() === 'Follow +' ? 'Followed' : 'Follow +';
    });
    expandBtnFollow.addEventListener('click', () => {
      expandBtnFollow.textContent = 
        expandBtnFollow.textContent.trim() === 'Follow +' ? 'Followed' : 'Follow +';
    });
  </script>
</body>
</html>
